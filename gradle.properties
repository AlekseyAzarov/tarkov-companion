org.gradle.jvmargs=-Xmx3g -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
android.useAndroidX=true
android.nonTransitiveRClass=true
# Classic Kotlin plugin instead of AGP 9's built-in Kotlin: KGP's ABI validation
# (checkKotlinAbi) does not see built-in Kotlin compilations yet. Revisit when it does.
android.builtInKotlin=false
android.newDsl=false

# Maven coordinates for the published SDK. The version lives in /VERSION.
GROUP=com.tarkovcompanion
POM_ARTIFACT_ID=sdk-android
