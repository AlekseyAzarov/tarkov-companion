name: Integration problem
description: The SDK misbehaves inside your game/app.
labels: [integration]
body:
  - type: markdown
    attributes:
      value: |
        Check [docs/troubleshooting.md](../../docs/troubleshooting.md) first; most integration issues are listed there with a fix.
  - type: input
    id: sdk
    attributes:
      label: SDK version
      description: "`TarkovCompanion.sdkVersion`"
    validations:
      required: true
  - type: input
    id: device
    attributes:
      label: Device, Android version, ABI
      placeholder: Pixel 8, Android 15, arm64-v8a
    validations:
      required: true
  - type: input
    id: webview
    attributes:
      label: WebView version
      description: Settings → Apps → Android System WebView
  - type: dropdown
    id: engine
    attributes:
      label: Host engine
      options: [Custom C++ / NativeActivity, GameActivity, Unity, Unreal, Plain Android app, Other]
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened, and what you expected
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: SDK logs go to your CompanionLogger, or logcat tag `TarkovCompanion`. Include analytics events if you have them (`bridge_error`, `bridge_request_failed`, `companion_launch_failed`).
      render: text
